[project]
name = "br8n"
version = "1.1.2"
description = "br8n — self-contained context-capture and resume engine."
readme = "README.md"
license = "MIT"
authors = [{ name = "Anthony Suherli", email = "anthonysuherli@gmail.com" }]
requires-python = ">=3.11"
keywords = ["claude-code", "mcp", "context", "knowledge-base", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  # Web
  "fastapi>=0.122.0",
  "uvicorn[standard]>=0.38.0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",

  # Agent / synopsis rebuild
  "langchain-core>=1.4.0",
  "langchain-anthropic>=1.4.3",
  "anthropic>=0.104.1",

  # Storage / auth
  # sqlite-vec is imported at module scope by br8n.store.sqlite, which the
  # default (local) backend always loads — it is a hard dep, not an extra.
  "sqlite-vec>=0.1.6",
  "supabase>=2.28.3",
  "asyncpg>=0.31.0",
  "pyjwt[crypto]>=2.10.1",
  "argon2-cffi>=25.1.0",
  "python-multipart>=0.0.20",

  # Embeddings + AI Gateway (exploration pipeline)
  "openai>=2.30.0",

  # Phase 3 gap-fill
  "tavily-python>=0.7.23",

  # MCP server
  "mcp>=1.16.0",

  # Resume card HTML templating
  "jinja2>=3.1.4",
]

[project.scripts]
br8n-mcp = "br8n.interfaces.mcp.server:main"
br8n-server = "br8n.api.main:run"

[project.urls]
Homepage = "https://github.com/anthonysuherli/br8n"
Repository = "https://github.com/anthonysuherli/br8n"
Issues = "https://github.com/anthonysuherli/br8n/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.3.0",
  "httpx>=0.28.1",
  # Upper bound so a major default-behaviour change lands as a deliberate bump,
  # not as a red CI run on an unrelated PR.
  "ruff>=0.12.0,<0.17",
  "pyright>=1.1.409",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["br8n*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pin the rule set explicitly. Ruff 0.16 widened its defaults (isort, pyupgrade,
# bugbear, bandit and more), which turned a green tree into 133 findings purely
# by upgrading the linter. Listing the rules means a ruff release can never
# redefine this gate underneath us; widening the set is now a deliberate commit.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a live local Supabase stack"]
