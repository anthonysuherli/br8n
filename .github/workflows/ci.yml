name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # The local-embeddings extra (fastembed) is installed on one leg only so
      # the real on-device model path is exercised once without slowing every leg.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install -e ".[dev,local-embeddings]"
          else
            pip install -e ".[dev]"
          fi

      - name: Lint
        run: ruff check .

      # Proves a bare install can actually serve — the exact check a new user runs.
      - name: Doctor
        env:
          BR8N_BACKEND: local
        run: python -m br8n.api.main --check

      - name: Tests
        env:
          BR8N_BACKEND: local
        run: pytest -q -m "not integration"

  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Catches a broken sdist/wheel before it reaches PyPI, not after.
      - name: Build and validate distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
