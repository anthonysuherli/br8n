name: Publish to PyPI

# Fires on a version tag. Uses PyPI Trusted Publishing (OIDC), so there is no API
# token stored in this repo — PyPI verifies the workflow identity instead. That
# requires a one-time setup on PyPI: add a trusted publisher for project "br8n"
# with owner "anthonysuherli", repository "br8n", workflow "release.yml", and
# environment "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # Refuse to publish a tag that disagrees with the packaged version, rather
      # than shipping a wheel whose number nobody can trace back to a commit.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*br8n-(.*)\.tar\.gz/\1/')
          echo "tag=$tag built=$built"
          [ "$tag" = "$built" ] || { echo "::error::tag $tag != package version $built"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing; no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
