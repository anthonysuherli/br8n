name: Publish to MCP Registry

# Lists br8n on registry.modelcontextprotocol.io.
#
# Authenticates with GitHub Actions OIDC, so there is no token to store or
# rotate and no interactive device-code flow — the io.github.anthonysuherli/*
# namespace is proven by the workflow's own identity.
#
# Ordering matters: the registry verifies ownership by reading the `mcp-name`
# marker out of the PUBLISHED PyPI description, so the package version named in
# server.json must already be on PyPI. This runs after the PyPI workflow
# succeeds, or on demand once you have published by hand.

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC; no secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    # workflow_run fires on failure too — only chase a successful PyPI publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      # Fail here rather than halfway through a publish.
      - name: Validate server.json
        run: ./mcp-publisher validate

      # The registry reads this marker from the published package description.
      # If the version in server.json is not on PyPI yet, say so plainly.
      - name: Confirm the named version is live on PyPI
        run: |
          version=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['version'])")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/br8n/$version/json")
          echo "br8n $version on PyPI -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::br8n $version is not on PyPI yet. Publish it first; the registry reads the mcp-name marker from the published description."
            exit 1
          fi

      - name: Login and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
